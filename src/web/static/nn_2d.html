<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARC Deep Neural Engine — 2D Topology</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #030712;
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }
        #viz {
            width: 100%;
            height: 100%;
        }
        .overlay {
            position: absolute;
            top: 2rem;
            left: 2rem;
            z-index: 10;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(12px);
            padding: 1.5rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.8);
            max-width: 380px;
        }
        .close-btn {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 1.2rem;
            cursor: pointer;
            transition: color 0.2s;
        }
        .close-btn:hover { color: #f8fafc; }
        h1 {
            font-size: 1.4rem;
            background: linear-gradient(135deg, #a855f7, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }
        p {
            font-size: 0.85rem;
            color: #94a3b8;
            line-height: 1.5;
            margin-bottom: 1rem;
        }
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.8rem;
            font-size: 0.75rem;
            color: #cbd5e1;
        }
        .stat-box {
            background: rgba(0,0,0,0.5);
            padding: 0.6rem;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .stat-value {
            font-weight: 700;
            color: #2ecc71;
            font-size: 1.1rem;
            display: block;
            margin-bottom: 2px;
        }
        .back-btn {
            display: block;
            margin-top: 1rem;
            padding: 0.5rem 1rem;
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            text-decoration: none;
            border-radius: 4px;
            font-size: 0.8rem;
            border: 1px solid rgba(59, 130, 246, 0.3);
            text-align: center;
            transition: all 0.2s;
        }
        .back-btn:hover { background: rgba(59, 130, 246, 0.3); }
        .pulse-text { animation: pulse-op 2s infinite alternate; }
        @keyframes pulse-op {
            from { opacity: 0.6; }
            to { opacity: 1; text-shadow: 0 0 10px rgba(59, 130, 246, 0.8); }
        }
        /* D3 Elements */
        .node { stroke: #fff; stroke-width: 1.5px; transition: fill 0.3s, r 0.3s; }
        .link { stroke: rgba(255, 255, 255, 0.15); stroke-opacity: 0.6; }
        .node.active { stroke: #fff; stroke-width: 3px; filter: drop-shadow(0 0 8px currentColor); }
        .link.active { stroke: #fff; stroke-opacity: 0.9; stroke-width: 2px; }
    </style>
</head>
<body>

    <div class="overlay" id="info-panel">
        <button class="close-btn" onclick="document.getElementById('info-panel').style.display='none'" title="Hide Panel">✖</button>
        <h1>ARC Deep Engine 2D</h1>
        <p>Real-time neural topology visualization. Showing multi-head attention hidden layers, state-space projection, and probabilistic output generation.</p>
        
        <div class="stats">
            <div class="stat-box">
                <span class="stat-value" id="val-nodes">0</span>
                Total Tensors Fired
            </div>
            <div class="stat-box">
                <span class="stat-value pulse-text" id="val-params" style="color: #3b82f6;">Listening...</span>
                Engine State
            </div>
            <div class="stat-box">
                <span class="stat-value" id="val-ops" style="color: #a855f7;">0</span>
                Active Agents
            </div>
            <div class="stat-box">
                <span class="stat-value" id="val-cluster" style="color: #eab308;">Idle</span>
                Active Layer
            </div>
        </div>
        
        <a href="/" class="back-btn">← Back to Dashboard</a>
    </div>

    <svg id="viz"></svg>

    <script>
        const width = window.innerWidth;
        const height = window.innerHeight;
        
        const ARC_LAYERS = [
            { id: 0, name: "Profiler (L0)", count: 10, color: "#64748b" },
            { id: 1, name: "Input (L1)", count: 25, color: "#3b82f6" },
            { id: 2, name: "Analysis (L2)", count: 35, color: "#8b5cf6" },
            { id: 3, name: "Grounding (L3)", count: 40, color: "#f59e0b" },
            { id: 4, name: "Synthesis (L4)", count: 25, color: "#ec4899" },
            { id: 5, name: "Audit (L4.5)", count: 30, color: "#ef4444" },
            { id: 6, name: "Output (L5)", count: 15, color: "#2ecc71" },
            { id: 7, name: "Supervisor (L6)", count: 10, color: "#eab308" }
        ];

        const nodes = [];
        const links = [];
        
        ARC_LAYERS.forEach(layer => {
            for (let i = 0; i < layer.count; i++) {
                nodes.push({ id: `${layer.id}_${i}`, layer: layer.id, name: layer.name, color: layer.color });
            }
        });

        for (let l = 0; l < ARC_LAYERS.length - 1; l++) {
            const currentNodes = nodes.filter(n => n.layer === l);
            const nextNodes = nodes.filter(n => n.layer === l + 1);
            currentNodes.forEach(c => {
                nextNodes.forEach(n => {
                    if (Math.random() < 0.15) {
                        links.push({ source: c.id, target: n.id });
                    }
                });
            });
        }

        const svg = d3.select("#viz").attr("width", width).attr("height", height);
        const container = svg.append("g");
        
        svg.call(d3.zoom().on("zoom", (e) => {
            container.attr("transform", e.transform);
        }));

        const simulation = d3.forceSimulation(nodes)
            .force("link", d3.forceLink(links).id(d => d.id).distance(50))
            .force("charge", d3.forceManyBody().strength(-30))
            .force("center", d3.forceCenter(width / 2, height / 2))
            .force("x", d3.forceX(d => (d.layer * 150) + (width/2 - 525)).strength(1))
            .force("y", d3.forceY(height / 2).strength(0.1));

        const link = container.append("g")
            .selectAll("line")
            .data(links)
            .join("line")
            .attr("class", "link");

        const node = container.append("g")
            .selectAll("circle")
            .data(nodes)
            .join("circle")
            .attr("class", "node")
            .attr("r", d => d.layer === 0 || d.layer === 7 ? 6 : 4)
            .attr("fill", d => d.color)
            .call(drag(simulation));

        simulation.on("tick", () => {
            link
                .attr("x1", d => d.source.x)
                .attr("y1", d => d.source.y)
                .attr("x2", d => d.target.x)
                .attr("y2", d => d.target.y);
            node
                .attr("cx", d => d.x)
                .attr("cy", d => d.y);
        });

        function drag(simulation) {
            function dragstarted(event) {
                if (!event.active) simulation.alphaTarget(0.3).restart();
                event.subject.fx = event.subject.x;
                event.subject.fy = event.subject.y;
            }
            function dragged(event) {
                event.subject.fx = event.x;
                event.subject.fy = event.y;
            }
            function dragended(event) {
                if (!event.active) simulation.alphaTarget(0);
                event.subject.fx = null;
                event.subject.fy = null;
            }
            return d3.drag().on("start", dragstarted).on("drag", dragged).on("end", dragended);
        }

        // --- WEBSOCKET SYNC ---
        const ws = new WebSocket(`ws://${window.location.host}/ws`);
        let totalEvents = 0;
        let activeAgents = new Set();

        ws.onopen = () => {
            document.getElementById('val-params').innerText = 'Connected';
            document.getElementById('val-params').style.color = '#2ecc71';
        };

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            totalEvents++;
            
            const agentName = data.agent || data.sender;
            if (agentName) activeAgents.add(agentName);
            
            document.getElementById('val-nodes').innerText = totalEvents.toString();
            document.getElementById('val-ops').innerText = activeAgents.size.toString();
            document.getElementById('val-params').innerText = 'Executing';
            document.getElementById('val-params').style.color = '#eab308';

            let targetLayer = 0;
            const sender = (agentName || "").toLowerCase();
            
            if (sender.includes("profiler") || sender === "rpa") targetLayer = 0;
            else if (sender.includes("git") || sender.includes("ingest") || sender.includes("input") || ["gi", "ci", "di", "sa", "qp"].includes(sender)) targetLayer = 1;
            else if (sender.includes("analysis") || sender.includes("codebreaker") || sender.includes("ast") || ["cb", "ad", "ca", "hm", "be"].includes(sender)) targetLayer = 2;
            else if (sender.includes("grounding") || ["wsa", "aa", "csa", "ea", "la", "gf", "fpa"].includes(sender)) targetLayer = 3;
            else if (sender.includes("synthesis") || ["conn", "ob", "cit", "crit"].includes(sender)) targetLayer = 4;
            else if (sender.includes("audit") || ["pc", "pr", "ai", "prv", "fqa"].includes(sender)) targetLayer = 5;
            else if (sender.includes("output") || sender.includes("writer") || ["wa", "pdf", "ppt"].includes(sender)) targetLayer = 6;
            else if (sender.includes("supervisor") || sender === "sup") targetLayer = 7;
            else targetLayer = 2; 

            document.getElementById('val-cluster').innerText = ARC_LAYERS[targetLayer].name;

            // Pulse effect
            node.classed("active", d => d.layer === targetLayer);
            link.classed("active", d => d.source.layer === targetLayer || d.target.layer === targetLayer);
            
            node.attr("fill", d => {
                if (d.layer === targetLayer) return '#ffffff';
                return d.color;
            }).attr("r", d => d.layer === targetLayer ? 8 : (d.layer === 0 || d.layer === 7 ? 6 : 4));

            clearTimeout(window.idleTimer);
            window.idleTimer = setTimeout(() => {
                document.getElementById('val-params').innerText = 'Listening...';
                document.getElementById('val-params').style.color = '#3b82f6';
                document.getElementById('val-cluster').innerText = 'Idle';
                
                activeAgents.clear();
                document.getElementById('val-ops').innerText = '0';
                
                node.classed("active", false).attr("fill", d => d.color).attr("r", d => d.layer === 0 || d.layer === 7 ? 6 : 4);
                link.classed("active", false);
            }, 2000);
        };

        ws.onclose = () => {
            document.getElementById('val-params').innerText = 'Disconnected';
            document.getElementById('val-params').style.color = '#ef4444';
        };
    </script>
</body>
</html>
